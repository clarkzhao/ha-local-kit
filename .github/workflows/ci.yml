name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .[dev]
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONUTF8: '1'
      - run: python scripts/check-public-tree.py --history
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  narwal-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sjmotew/NarwalIntegration
          ref: 4e5884066895ee2ed29b81a6aba107fd32590982
          path: .upstream/narwal
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'websockets>=15,<17' 'bbpb>=1.4,<2' 'Pillow>=9,<13'
      - run: python extras/narwal/client_regression.py .upstream/narwal/custom_components/narwal
