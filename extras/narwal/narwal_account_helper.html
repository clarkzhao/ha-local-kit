<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>云鲸 · 读取设备标识</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#162333;font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif}
main{max-width:540px;margin:7vh auto;padding:32px;background:white;border:1px solid #dde5eb;border-radius:20px;box-shadow:0 12px 40px #25445f0a}
.eyebrow{color:#527082;font-size:13px;letter-spacing:.1em}h1{font-size:27px;margin:6px 0 10px}p{color:#526371}label{display:block;font-size:14px;font-weight:600;margin:22px 0 8px}
input{width:100%;padding:13px;font:inherit;border:1px solid #bccbd5;border-radius:9px;background:white;color:#162333}input:focus{outline:2px solid #529ca4;outline-offset:2px}
.row{display:flex;gap:10px}.row input{min-width:0}button{font:inherit;cursor:pointer;border:0;border-radius:9px;background:#127b83;color:white;padding:12px 18px;white-space:nowrap}button:disabled{opacity:.5;cursor:default}
#login{width:100%;margin-top:25px}#status{background:#f0f7f7;border-radius:10px;padding:14px;min-height:54px;font-size:14px;margin-top:22px;overflow-wrap:anywhere}
small{display:block;color:#667784;margin-top:22px;font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7f9;padding:12px;border-radius:8px;font-size:13px}
@media(max-width:600px){main{margin:18px 12px;padding:24px}.row{gap:8px}.row button{padding:12px}}
</style>
<main>
<div class="eyebrow">NARWAL · 中国区</div>
<h1>读取机器人的设备标识</h1>
<p>使用已有的云鲸手机号账号登录，查询 <b>Device ID</b> 和 <b>product_key</b>，用于后续测试局域网连接。</p>
<form id="form" autocomplete="off">
<label for="phone">手机号 · +86</label>
<input id="phone" name="phone" inputmode="tel" type="tel" autocomplete="off" maxlength="11" placeholder="云鲸 App 的登录手机号" required>
<label for="code">短信验证码</label>
<div class="row"><input id="code" name="code" inputmode="numeric" type="text" maxlength="6" autocomplete="one-time-code" placeholder="6 位验证码" required><button id="sms" type="button">获取验证码</button></div>
<button id="login" type="submit">登录并读取设备标识</button>
</form>
<div id="status" role="status" aria-live="polite">等待输入。若出现图形验证，请在弹窗中完成。</div>
<pre id="result" hidden></pre>
<button id="retry" type="button" hidden>重试设备查询</button>
<small>此页面运行在当前电脑。手机号与验证码提交到云鲸中国区；登录凭据仅保留在工具内存中，查询成功后清除。设备标识保存在本地项目的 .local/narwal 中。</small>
</main>
<script>
const csrf='__CSRF__', $=id=>document.getElementById(id);
let busy=false, cooldown=0;
function status(text){$('status').textContent=text;}
function buttons(){ $('sms').disabled=busy||cooldown>0; $('login').disabled=busy; $('retry').disabled=busy; $('sms').textContent=cooldown>0?`${cooldown} 秒后重发`:'获取验证码'; }
async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(body)});return await r.json();}
async function captcha(){
 status('云鲸要求图形验证，请完成弹窗中的验证。');
 if(!window.initNECaptcha){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cstaticdun.126.net/load.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('图形验证组件加载失败。'));document.head.appendChild(s);});}
 return await new Promise((resolve,reject)=>{
  let instance;
  window.initNECaptcha({element:document.body,captchaId:'0beb28888901403aa7163153261aa506',lang:'zh-CN',width:'320px',mode:'popup',apiVersion:2,riskType:'ai',popupStyles:{position:'fixed',top:'20%'},
   onVerify:(err,data)=>{if(!err&&data?.validate){resolve(data.validate);setTimeout(()=>instance?.destroy(),500);}},
   onClose:()=>{reject(new Error('图形验证已关闭，尚未发送短信。'));setTimeout(()=>instance?.destroy(),500);}
  },i=>{instance=i;i.verify();},()=>reject(new Error('图形验证初始化失败，请告知助手。')));
 });
}
$('sms').onclick=async()=>{
 if(!/^1[3-9]\d{9}$/.test($('phone').value.trim())){status('请填写 11 位中国大陆手机号。');return;}
 busy=true;buttons();status('正在请求验证码……');
 try{
  const body={mobile:$('phone').value.trim()};let r=await post('/api/sms',body);
  if(r.captcha_required){body.captcha_verify_param=await captcha();r=await post('/api/sms',body);}
  status(r.message);
  if(r.ok){cooldown=60;const timer=setInterval(()=>{cooldown--;buttons();if(cooldown<=0)clearInterval(timer);},1000);$('code').focus();}
 }catch(e){status(e.message||'请求失败。');}finally{busy=false;buttons();}
};
function showResult(r){status(r.message);if(r.ok&&r.devices){$('code').value='';$('phone').value='';$('result').textContent=JSON.stringify(r.devices,null,2);$('result').hidden=false;$('form').hidden=true;$('retry').hidden=true;}else{$('retry').hidden=false;}}
$('form').onsubmit=async event=>{
 event.preventDefault();busy=true;buttons();status('正在登录并读取设备标识……');
 const body={mobile:$('phone').value.trim(),verification:$('code').value.trim()};$('code').value='';
 try{showResult(await post('/api/login',body));}catch(e){status(e.message||'请求失败。');}finally{body.verification='';busy=false;buttons();}
};
$('retry').onclick=async()=>{busy=true;buttons();try{showResult(await post('/api/query',{}));}catch(e){status('查询失败。');}finally{busy=false;buttons();}};
</script>
</html>
